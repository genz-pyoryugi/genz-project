<!DOCTYPE html>
<html lang="ko" class="theme-sim">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI 팀장 시뮬레이션</title>
  <link rel="stylesheet" href="css/chat.css" />
  <link rel="stylesheet" href="css/simulation-theme.css" />
  <style>
    @font-face { font-family: 'Quiz Noto'; src: url('/quiz/fonts/NotoSansKR-Variable.ttf') format('truetype'); font-weight: 100 900; font-display: swap; }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; background: #fff; }
    body, button, input { font-family: 'Quiz Noto', 'Malgun Gothic', sans-serif; }
    .chat { position: relative; left: 0; top: 0; width: 100%; height: 100%; border: 0; border-radius: 0; box-shadow: none; transform: none; opacity: 1; }
    .theme-sim .chat__head { position: relative; padding: 20px 112px 16px 20px; }
    .sim-exit { position: absolute; right: 16px; top: 24px; color: #175487; font-size: 13px; font-weight: 700; text-decoration: none; }
    .sim-exit:focus-visible { outline: 3px solid #168bbd; outline-offset: 4px; }
    .chat__title { margin: 0; font-size: 22px; }
    .chat__sub { margin: 6px 0 0; font-size: 12px; }
    @media(max-width:480px) { .chat__title { font-size: 19px; } .chat__sub { line-height: 1.6; } }
  </style>
</head>
<body>
  <main class="chat is-open" aria-labelledby="simulation-title">
    <header class="chat__head">
      <h1 id="simulation-title" class="chat__title">AI 팀장 시뮬레이션</h1>
      <p class="chat__sub">실제 회사 상황으로 AI 팀장과 대화를 연습해 보세요</p>
      <a class="sim-exit" href="/quiz">퀴즈로 돌아가기</a>
    </header>
  </main>
  <script src="/vendor/supabase.js"></script>
  <script src="/tracking/learning-tracker.js"></script>
  <script src="js/components/util.js"></script>
  <script src="js/simulation-topics.js"></script>
  <script src="js/simulation.js"></script>
  <script src="js/simulation-page.js"></script>
</body>
</html>
