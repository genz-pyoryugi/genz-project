<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 440" width="280" height="440" role="img" aria-label="하늘색 펜 캐릭터">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#bfe6ff"/><stop offset=".55" stop-color="#7cc6f7"/><stop offset="1" stop-color="#4aa3ea"/>
    </linearGradient>
    <linearGradient id="tip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffc27a"/><stop offset="1" stop-color="#ff8a2a"/>
    </linearGradient>
  </defs>
  <!-- sparks -->
  <g stroke="#ff8a2a" stroke-width="5" stroke-linecap="round"><path d="M44 62l-14-10M60 40l-4-16M84 30l6-14"/></g>
  <g stroke="#3a86e8" stroke-width="5" stroke-linecap="round"><path d="M226 120l16-6M220 96l14-12"/></g>
  <g transform="rotate(-12 140 220)">
    <!-- legs + shoes -->
    <g stroke="#17408a" stroke-width="6" stroke-linecap="round" fill="none"><path d="M122 352l-8 38M152 352l8 34"/></g>
    <g fill="#ff8a2a" stroke="#17408a" stroke-width="5" stroke-linejoin="round">
      <path d="M96 392c2-10 18-12 28-6 6 4 4 14-4 16H100c-6 0-6-6-4-10z"/>
      <path d="M150 388c4-9 20-8 28-2 6 5 3 14-5 15h-18c-6-1-7-8-5-13z"/>
    </g>
    <!-- tip -->
    <path d="M100 300h80l-40 66z" fill="url(#tip)" stroke="#17408a" stroke-width="6" stroke-linejoin="round"/>
    <path d="M132 352h16l-8 14z" fill="#17408a"/>
    <!-- clip -->
    <path d="M86 52c-14 0-20 8-20 20v96c0 8 6 12 14 12h8V52z" fill="#ff9a3c" stroke="#17408a" stroke-width="6" stroke-linejoin="round"/>
    <!-- body -->
    <rect x="88" y="34" width="104" height="280" rx="50" fill="url(#body)" stroke="#17408a" stroke-width="6"/>
    <rect x="106" y="150" width="68" height="104" rx="26" fill="#fff" stroke="#17408a" stroke-width="4"/>
    <!-- face -->
    <ellipse cx="124" cy="190" rx="6.5" ry="9" fill="#17408a"/><ellipse cx="156" cy="190" rx="6.5" ry="9" fill="#17408a"/>
    <circle cx="126" cy="186" r="2.4" fill="#fff"/><circle cx="158" cy="186" r="2.4" fill="#fff"/>
    <ellipse cx="114" cy="210" rx="7" ry="4.5" fill="#ffb3b3"/><ellipse cx="166" cy="210" rx="7" ry="4.5" fill="#ffb3b3"/>
    <path d="M128 208c4 14 20 14 24 0z" fill="#ff6f61" stroke="#17408a" stroke-width="3.5" stroke-linejoin="round"/>
    <!-- left arm (waving) -->
    <path d="M92 214c-26 4-40-8-44-40" fill="none" stroke="#17408a" stroke-width="6" stroke-linecap="round"/>
    <circle cx="46" cy="164" r="15" fill="#fff" stroke="#17408a" stroke-width="5"/>
    <!-- right arm (pointing) -->
    <path d="M188 218c22 4 36-4 52-22" fill="none" stroke="#17408a" stroke-width="6" stroke-linecap="round"/>
    <circle cx="246" cy="190" r="15" fill="#fff" stroke="#17408a" stroke-width="5"/>
    <path d="M254 184l16-8" stroke="#17408a" stroke-width="7" stroke-linecap="round"/>
  </g>
</svg>
